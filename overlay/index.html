<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    -webkit-user-select: none;
    font: 13px/1.3 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  }
  #cursor, #panel {
    position: absolute;
    left: 0;
    top: 0;
    transform: translate(-100px, -100px);
    transition: transform 400ms cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform;
  }
  #cursor.hidden, #panel.hidden { visibility: hidden; }
  #cursor svg {
    display: block;
    width: 24px;
    height: 24px;
    margin: -2px 0 0 -3px; /* the arrow tip is at (3,2) in the drawing: put it exactly on (x,y) */
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.35));
  }
  #label {
    position: absolute;
    left: 26px;
    top: 22px;
    padding: 5px 9px;
    border-radius: 8px;
    background: rgba(20, 20, 24, 0.9);
    color: #fff;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
  }
  #label:empty { display: none; }
  #box {
    position: absolute;
    left: 26px;
    top: 52px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: max-content;
    max-width: 280px;
  }
  #panel.flip-x #box { left: auto; right: 10px; }
  #panel.flip-y #box { top: auto; bottom: 10px; }
  #card, #details {
    padding: 8px 10px;
    border-radius: 10px;
    background: rgba(20, 20, 24, 0.9);
    color: #fff;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
  }
  #card .row { display: flex; align-items: flex-start; gap: 8px; }
  #text {
    flex: 1;
    overflow: hidden;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 3;
    overflow-wrap: anywhere;
  }
  .state {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.55);
  }
  .buttons { display: flex; gap: 6px; margin-top: 8px; }
  #card button {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 22px;
    min-width: 22px;
    padding: 0 7px;
    border: 0;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    font: 12px/1 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    cursor: pointer;
  }
  #card button:hover { background: rgba(255, 255, 255, 0.22); }
  #card button svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #card #chevron { padding: 0; background: transparent; }
  #chevron svg { transition: transform 150ms; }
  #card.collapsed { padding: 3px; }
  #card.collapsed #text, #card.collapsed .state, #card.collapsed .buttons { display: none; }
  #card.collapsed #chevron svg { transform: rotate(-90deg); }
  #stop { font-size: 15px; }
  #details-button.on { background: rgba(255, 62, 165, 0.35); }
  #details {
    max-height: 320px;
    overflow-y: auto;
    font-size: 12px;
  }
  #details.hidden, #card.collapsed ~ #details { display: none; }
  #plan .step {
    padding: 3px 0 3px 8px;
    border-left: 2px solid transparent;
    color: rgba(255, 255, 255, 0.5);
    overflow-wrap: anywhere;
  }
  #plan .step.current { border-left-color: #ff3ea5; color: #fff; }
  #plan .step.done::before { content: '✓ '; }
  #chat { margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(255, 255, 255, 0.12); }
  #chat:empty, #plan:empty + #chat { margin-top: 0; padding-top: 0; border-top: 0; }
  #chat .line { padding: 2px 0; overflow-wrap: anywhere; }
  #chat .who { color: rgba(255, 255, 255, 0.5); margin-right: 5px; }
  #chat .shadow .who { color: #ff3ea5; }
  /* Listening mode: dot + hint, live text, Send / Cancel instead of the step and its buttons. */
  #listen { display: none; }
  #panel.listening #listen { display: block; }
  #panel.listening .row, #panel.listening #state, #panel.listening #buttons { display: none; }
  #panel.listening #card { padding: 8px 10px; }
  #listen .state { margin-top: 0; }
  #live {
    margin-top: 6px;
    min-height: 1.3em;
    max-height: 6.5em; /* ~5 lines */
    overflow-y: auto;
    overflow-wrap: anywhere;
  }
  #panel.paused:not(.listening) #box { opacity: 0.6; }
  .dot {
    flex: none;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ff3ea5;
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(0.8); opacity: 0.6; }
    50% { transform: scale(1.2); opacity: 1; }
  }
</style>
</head>
<body>
<div id="cursor" class="hidden">
  <svg viewBox="0 0 24 24">
    <path d="M3 2 L3 19 L7.5 15 L10.5 21.5 L13.5 20.2 L10.5 13.8 L16.5 13.8 Z"
          fill="#ff3ea5" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>
  </svg>
  <div id="label"></div>
</div>
<div id="panel" class="hidden">
  <div id="box">
    <div id="card">
      <div class="row">
        <div id="text"></div>
        <button id="chevron" title="Collapse"><svg viewBox="0 0 12 12"><path d="M2 4l4 4 4-4"/></svg></button>
      </div>
      <div id="state" class="state"></div>
      <div id="buttons" class="buttons">
        <button id="next" title="I did it / skip">Next</button>
        <button id="mode" title="Switch mode">Guide</button>
        <button id="mic" title="Talk"><svg viewBox="0 0 12 12"><rect x="4" y="1" width="4" height="7" rx="2"/><path d="M2 6a4 4 0 0 0 8 0M6 10v1.5"/></svg></button>
        <button id="details-button" title="All steps and conversation">Details</button>
        <button id="stop" title="Stop">×</button>
      </div>
      <div id="listen">
        <div class="state"><span class="dot"></span>Listening… ⌃⌥Space to send · ⌃⌥X to cancel</div>
        <div id="live"></div>
        <div class="buttons">
          <button id="send" title="Send now">Send</button>
          <button id="cancel" title="Cancel">Cancel</button>
        </div>
      </div>
    </div>
    <div id="details" class="hidden">
      <div id="plan"></div>
      <div id="chat"></div>
    </div>
  </div>
</div>
<script>
  const cursor = document.getElementById('cursor');
  const label = document.getElementById('label');
  const panel = document.getElementById('panel');
  const box = document.getElementById('box');
  const card = document.getElementById('card');
  const text = document.getElementById('text');
  const state = document.getElementById('state');
  const modeButton = document.getElementById('mode');
  const detailsButton = document.getElementById('details-button');
  const details = document.getElementById('details');
  const plan = document.getElementById('plan');
  const chat = document.getElementById('chat');
  const live = document.getElementById('live');

  const STATES = { thinking: 'Thinking…', waiting: 'Your turn', acting: 'Doing it…', paused: 'Paused', done: 'Done' };
  const WHO = { you: 'You', shadow: 'Shadow' };
  const PANEL_W = 320; // card max width + offset, used to keep it on screen
  const CHAT_KEEP = 20;
  const CHAT_SHOW = 6;
  let mode = 'guide';
  let panelOn = false;
  let doneTimer = null;
  let panelPos = { x: 0, y: 0 };
  let listeningOn = false;
  let chatLines = [];

  function place(x, y) {
    panelPos = { x, y };
    panel.style.transform = `translate(${x}px, ${y}px)`;
    panel.classList.toggle('flip-x', x + PANEL_W > innerWidth);
    panel.classList.toggle('flip-y', y + 60 + box.offsetHeight > innerHeight);
  }

  function setMode(next) {
    mode = next;
    modeButton.textContent = mode === 'do' ? 'Do it' : 'Guide';
  }

  // The panel is open while a step is shown or the brain listens; listening takes over the card.
  function render() {
    panel.classList.toggle('listening', listeningOn);
    panel.classList.toggle('hidden', !(panelOn || listeningOn));
    if (!panelOn && !listeningOn) window.overlay.interactive(false);
    place(panelPos.x, panelPos.y);
  }

  function renderPlan(steps) {
    plan.innerHTML = '';
    for (const step of steps) {
      const div = document.createElement('div');
      div.className = `step ${step.status || 'todo'}`;
      div.textContent = step.text || '';
      plan.appendChild(div);
    }
  }

  function renderChat() {
    chat.innerHTML = '';
    for (const line of chatLines.slice(-CHAT_SHOW)) {
      const div = document.createElement('div');
      div.className = `line ${line.who}`;
      const who = document.createElement('span');
      who.className = 'who';
      who.textContent = WHO[line.who] || line.who;
      div.append(who, line.text);
      chat.appendChild(div);
    }
    chat.scrollTop = chat.scrollHeight;
  }

  function hidePanel() {
    panelOn = false;
    panel.classList.remove('paused');
    clearTimeout(doneTimer);
    render();
  }

  box.addEventListener('mouseenter', () => window.overlay.interactive(true));
  box.addEventListener('mouseleave', () => window.overlay.interactive(false));
  document.getElementById('chevron').addEventListener('click', () => card.classList.toggle('collapsed'));
  document.getElementById('next').addEventListener('click', () => window.overlay.send({ type: 'next' }));
  document.getElementById('mic').addEventListener('click', () => window.overlay.send({ type: 'mic' }));
  document.getElementById('stop').addEventListener('click', () => window.overlay.send({ type: 'stop' }));
  document.getElementById('send').addEventListener('click', () => window.overlay.send({ type: 'hotkey' }));
  document.getElementById('cancel').addEventListener('click', () => window.overlay.send({ type: 'stop' }));
  modeButton.addEventListener('click', () => {
    setMode(mode === 'do' ? 'guide' : 'do');
    window.overlay.send({ type: 'mode', mode });
  });
  detailsButton.addEventListener('click', () => {
    const on = details.classList.toggle('hidden') === false;
    detailsButton.classList.toggle('on', on);
    place(panelPos.x, panelPos.y);
  });

  window.overlay.onMessage((msg) => {
    switch (msg.type) {
      case 'follow':
        cursor.style.transition = msg.glide ? '' : 'none';
        cursor.style.transform = `translate(${msg.x}px, ${msg.y}px)`;
        cursor.classList.remove('hidden');
        break;
      case 'cursor':
        cursor.style.transition = '';
        cursor.style.transform = `translate(${msg.x}px, ${msg.y}px)`;
        place(msg.x, msg.y);
        label.textContent = msg.label || '';
        cursor.classList.remove('hidden');
        break;
      case 'step':
        if (msg.x !== undefined) place(msg.x, msg.y);
        text.textContent = msg.text || '';
        state.textContent = STATES[msg.state] || '';
        panel.classList.toggle('paused', msg.state === 'paused');
        if (msg.mode) setMode(msg.mode);
        panelOn = true;
        render();
        clearTimeout(doneTimer);
        if (msg.state === 'done') doneTimer = setTimeout(hidePanel, 6000);
        break;
      case 'plan':
        renderPlan(msg.steps || []);
        break;
      case 'chat':
        chatLines = chatLines.concat({ who: msg.who || 'shadow', text: msg.text || '' }).slice(-CHAT_KEEP);
        renderChat();
        break;
      case 'hide':
        cursor.classList.add('hidden');
        panel.classList.add('hidden');
        window.overlay.interactive(false);
        requestAnimationFrame(() => requestAnimationFrame(() => window.overlay.hidden()));
        break;
      case 'show':
        cursor.classList.remove('hidden');
        if (panelOn || listeningOn) panel.classList.remove('hidden');
        break;
      case 'clear':
        if (!msg.keepCursor) cursor.classList.add('hidden');
        label.textContent = '';
        chatLines = [];
        renderPlan([]);
        renderChat();
        hidePanel();
        break;
      case 'listening':
        listeningOn = Boolean(msg.on);
        if (listeningOn) live.textContent = '';
        if (msg.x !== undefined) place(msg.x, msg.y);
        render();
        break;
      case 'transcript':
        live.textContent = msg.text || '';
        live.scrollTop = live.scrollHeight;
        break;
    }
  });
</script>
</body>
</html>
