<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --accent: #ff3ea5; } /* the brain can change it: {"type":"theme","color":"#…"} */
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    -webkit-user-select: none;
    font: 13px/1.3 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  }
  #cursor, #panel {
    position: absolute;
    left: 0;
    top: 0;
    transform: translate(-100px, -100px);
    transition: transform 400ms cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform;
  }
  #cursor.hidden, #panel.hidden { visibility: hidden; }
  #cursor svg {
    display: block;
    width: 24px;
    height: 24px;
    margin: -2px 0 0 -3px; /* the arrow tip is at (3,2) in the drawing: put it exactly on (x,y) */
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.35));
  }
  /* It spins while thinking, and grows a little once it arrives on what it points at. */
  #cursor svg { transform-origin: 3px 2px; }
  @media (prefers-reduced-motion: no-preference) {
    #cursor.hop svg { animation: hop 520ms cubic-bezier(0.34, 1.56, 0.64, 1) 380ms; }
    #cursor.thinking svg { transform-origin: 9px 11px; animation: think 1.1s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
  }
  @keyframes hop { 0%, 100% { transform: scale(1); } 45% { transform: scale(1.3); } }
  @keyframes think { to { transform: rotate(360deg); } }
  #label {
    position: absolute;
    left: 26px;
    top: 22px;
    padding: 5px 9px;
    border-radius: 8px;
    background: rgba(20, 20, 24, 0.9);
    color: #fff;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
  }
  #label:empty { display: none; }
  /* Tentative cursor: a guess while the person is still talking. */
  #cursor.tentative { opacity: 0.55; }
  #cursor.tentative svg { animation: soft 1.4s ease-in-out infinite; }
  #cursor.tentative #label { font-style: italic; }
  @keyframes soft {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }
  /* Speech-start pulse: one ring expanding from the arrow tip. */
  #ring {
    position: absolute;
    left: -16px;
    top: -16px;
    width: 32px;
    height: 32px;
    border: 2px solid var(--accent);
    border-radius: 50%;
    opacity: 0;
    pointer-events: none;
  }
  #ring.on { animation: ring 600ms ease-out; }
  @keyframes ring {
    0% { transform: scale(0.3); opacity: 0.9; }
    100% { transform: scale(2); opacity: 0; }
  }
  #box {
    position: absolute;
    left: 26px;
    top: 52px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: max-content;
    max-width: 280px;
  }
  #panel.flip-x #box { left: auto; right: 10px; }
  #panel.flip-y #box { top: auto; bottom: 10px; }
  #card, #details, #answer {
    padding: 8px 10px;
    border-radius: 10px;
    background: rgba(20, 20, 24, 0.9);
    color: #fff;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
  }
  .row { display: flex; align-items: flex-start; gap: 8px; }
  #text {
    flex: 1;
    overflow: hidden;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 3;
    overflow-wrap: anywhere;
  }
  #why {
    margin-top: 2px;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.55);
    overflow-wrap: anywhere;
  }
  #why:empty { display: none; }
  .state {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.55);
  }
  .buttons { display: flex; gap: 6px; margin-top: 8px; }
  #box button {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 22px;
    min-width: 22px;
    padding: 0 7px;
    border: 0;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    font: 12px/1 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    cursor: pointer;
  }
  #box button:hover { background: rgba(255, 255, 255, 0.22); }
  #box button svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #box #chevron, #box #answer-close { padding: 0; background: transparent; }
  #chevron svg { transition: transform 150ms; }
  #card.collapsed { padding: 3px; }
  #card.collapsed #text, #card.collapsed #why, #card.collapsed .state, #card.collapsed .buttons { display: none; }
  #card.collapsed #chevron svg { transform: rotate(-90deg); }
  #stop, #answer-close { font-size: 15px; }
  /* Open mic during a task: live dot when on, muted (slashed) icon when off. */
  #mic .live, #mic .slash { display: none; }
  #mic.on .live { display: block; width: 6px; height: 6px; margin-left: 4px; border-radius: 50%; background: var(--accent); animation: pulse 1s ease-in-out infinite; }
  #mic.off { color: rgba(255, 255, 255, 0.45); }
  #mic.off .slash { display: block; }
  #heard {
    margin-top: 6px;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.55);
    overflow-wrap: anywhere;
    transition: opacity 800ms;
  }
  #heard:empty { display: none; }
  #heard.fade { opacity: 0; }
  #card.collapsed #heard { display: none; }
  #details-button.on { background: color-mix(in srgb, var(--accent) 35%, transparent); }
  #details {
    max-height: 320px;
    overflow-y: auto;
    font-size: 12px;
  }
  #details.hidden, #card.collapsed ~ #details { display: none; }
  #plan .step {
    padding: 3px 0 3px 8px;
    border-left: 2px solid transparent;
    color: rgba(255, 255, 255, 0.5);
    overflow-wrap: anywhere;
  }
  #plan .step.current { border-left-color: var(--accent); color: #fff; }
  #plan .step.done::before { content: '✓ '; }
  #chat { margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(255, 255, 255, 0.12); }
  #chat:empty, #plan:empty + #chat { margin-top: 0; padding-top: 0; border-top: 0; }
  #chat .line { padding: 2px 0; overflow-wrap: anywhere; }
  #chat .who { color: rgba(255, 255, 255, 0.5); margin-right: 5px; }
  #chat .shadow .who { color: var(--accent); }
  /* Listening mode: dot + hint, live text, Send / Cancel instead of the step and its buttons. */
  #listen { display: none; }
  #panel.listening #listen { display: block; }
  #panel.listening .row, #panel.listening #why, #panel.listening #state, #panel.listening #buttons { display: none; }
  /* Speech bubble: black, your words in quotes, the sharp corner points at the pink cursor. */
  #panel.listening #card {
    padding: 10px 14px;
    border-radius: 3px 16px 16px 16px;
    background: #17171a;
    color: #fff;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.1);
  }
  #panel.listening.flip-x #card { border-radius: 16px 3px 16px 16px; }
  #panel.listening.flip-y #card { border-radius: 16px 16px 16px 3px; }
  #panel.listening.flip-x.flip-y #card { border-radius: 16px 16px 3px 16px; }
  #listen .state { margin-top: 0; color: rgba(255, 255, 255, 0.55); }
  #listen #live { font-size: 14px; line-height: 1.4; }
  #listen #live:not(:empty)::before { content: '“'; }
  #listen #live:not(:empty)::after { content: '”'; }
  #panel.listening #box button { background: rgba(255, 255, 255, 0.12); color: #fff; }
  #panel.listening #box button:hover { background: rgba(255, 255, 255, 0.22); }
  #panel.listening #box #send { background: var(--accent); color: #fff; }
  #live {
    margin-top: 6px;
    min-height: 1.3em;
    max-height: 6.5em; /* ~5 lines */
    overflow-y: auto;
    overflow-wrap: anywhere;
  }
  #panel.paused:not(.listening) #box { opacity: 0.6; }
  /* Answer card: replaces the step card while it is open (no task runs). */
  #answer { display: none; }
  #panel.answer #answer { display: block; }
  #panel.answer #card, #panel.answer #details { display: none; }
  #answer-text {
    flex: 1;
    max-height: 7.8em; /* ~6 lines */
    overflow-y: auto;
    overflow-wrap: anywhere;
  }
  #sources:empty, #offer.hidden { display: none; }
  #sources { margin-top: 6px; }
  .source {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.55);
    cursor: pointer;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .source:hover { color: #fff; }
  #offer-text { margin-top: 8px; }
  .dot {
    flex: none;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(0.8); opacity: 0.6; }
    50% { transform: scale(1.2); opacity: 1; }
  }
</style>
</head>
<body>
<div id="cursor" class="hidden">
  <svg viewBox="0 0 24 24">
    <path d="M3 2 L3 19 L7.5 15 L10.5 21.5 L13.5 20.2 L10.5 13.8 L16.5 13.8 Z"
          style="fill: var(--accent)" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>
  </svg>
  <div id="ring"></div>
  <div id="label"></div>
</div>
<div id="panel" class="hidden">
  <div id="box">
    <div id="card">
      <div class="row">
        <div id="text"></div>
        <button id="chevron" title="Collapse"><svg viewBox="0 0 12 12"><path d="M2 4l4 4 4-4"/></svg></button>
      </div>
      <div id="why"></div>
      <div id="state" class="state"></div>
      <div id="buttons" class="buttons">
        <button id="next" title="I did it / skip">Next</button>
        <button id="mode" title="Switch mode">Guide</button>
        <button id="mic" title="Talk"><svg viewBox="0 0 12 12"><rect x="4" y="1" width="4" height="7" rx="2"/><path d="M2 6a4 4 0 0 0 8 0M6 10v1.5"/><path class="slash" d="M1.5 1.5l9 9"/></svg><span class="live"></span></button>
        <button id="details-button" title="All steps and conversation">Details</button>
        <button id="stop" title="Stop">×</button>
      </div>
      <div id="heard"></div>
      <div id="listen">
        <div class="state"><span class="dot"></span>Listening… ⌃⌥Space to send</div>
        <div id="live"></div>
        <div class="buttons">
          <button id="send" title="Send now">Send</button>
          <button id="cancel" title="Cancel">Cancel</button>
        </div>
      </div>
    </div>
    <div id="details" class="hidden">
      <div id="plan"></div>
      <div id="chat"></div>
    </div>
    <div id="answer">
      <div class="row">
        <div id="answer-text"></div>
        <button id="answer-close" title="Close">×</button>
      </div>
      <div id="sources"></div>
      <div id="offer" class="hidden">
        <div id="offer-text"></div>
        <div class="buttons">
          <button id="show-me">Show me</button>
          <button id="do-it">Do it</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
  const cursor = document.getElementById('cursor');
  const label = document.getElementById('label');
  const ring = document.getElementById('ring');
  const panel = document.getElementById('panel');
  const box = document.getElementById('box');
  const card = document.getElementById('card');
  const text = document.getElementById('text');
  const why = document.getElementById('why');
  const state = document.getElementById('state');
  const modeButton = document.getElementById('mode');
  const micButton = document.getElementById('mic');
  const heard = document.getElementById('heard');
  const detailsButton = document.getElementById('details-button');
  const details = document.getElementById('details');
  const plan = document.getElementById('plan');
  const chat = document.getElementById('chat');
  const live = document.getElementById('live');
  const answerText = document.getElementById('answer-text');
  const sources = document.getElementById('sources');
  const offer = document.getElementById('offer');
  const offerText = document.getElementById('offer-text');

  let hopTimer;
  const STATES = { thinking: 'Thinking…', waiting: 'Your turn', acting: 'Doing it…', paused: 'Paused', done: 'Done' };
  const WHO = { you: 'You', shadow: 'Shadow' };
  const PANEL_W = 320; // card max width + offset, used to keep it on screen
  const CHAT_KEEP = 20;
  const CHAT_SHOW = 6;
  const SOURCES_SHOW = 3;
  const ANSWER_MS = 30000;
  const HEARD_MS = 6000;
  let mode = 'guide';
  let panelOn = false;
  let doneTimer = null;
  let panelPos = { x: 0, y: 0 };
  let listeningOn = false;
  let answerOn = false;
  let answerTimer = null;
  let chatLines = [];
  let heardTimer = null;

  function place(x, y) {
    panelPos = { x, y };
    panel.style.transform = `translate(${x}px, ${y}px)`;
    panel.classList.toggle('flip-x', x + PANEL_W > innerWidth);
    panel.classList.toggle('flip-y', y + 60 + box.offsetHeight > innerHeight);
  }

  function setMode(next) {
    mode = next;
    modeButton.textContent = mode === 'do' ? 'Do it' : 'Guide';
  }

  // The panel is open while a step is shown, the brain listens or an answer is shown; listening
  // and the answer card take over the step card.
  function render() {
    panel.classList.toggle('listening', listeningOn);
    panel.classList.toggle('answer', answerOn);
    panel.classList.toggle('hidden', !(panelOn || listeningOn || answerOn));
    if (!panelOn && !listeningOn && !answerOn) window.overlay.interactive(false);
    place(panelPos.x, panelPos.y);
  }

  function renderPlan(steps) {
    plan.innerHTML = '';
    for (const step of steps) {
      const div = document.createElement('div');
      div.className = `step ${step.status || 'todo'}`;
      div.textContent = step.text || '';
      plan.appendChild(div);
    }
  }

  function renderChat() {
    chat.innerHTML = '';
    for (const line of chatLines.slice(-CHAT_SHOW)) {
      const div = document.createElement('div');
      div.className = `line ${line.who}`;
      const who = document.createElement('span');
      who.className = 'who';
      who.textContent = WHO[line.who] || line.who;
      div.append(who, line.text);
      chat.appendChild(div);
    }
    chat.scrollTop = chat.scrollHeight;
  }

  function hidePanel() {
    panelOn = false;
    panel.classList.remove('paused');
    clearTimeout(doneTimer);
    render();
  }

  function hideAnswer() {
    answerOn = false;
    clearTimeout(answerTimer);
    render();
  }

  function showAnswer(msg) {
    answerText.textContent = msg.text || '';
    answerText.scrollTop = 0;
    sources.innerHTML = '';
    for (const source of (msg.sources || []).slice(0, SOURCES_SHOW)) {
      const div = document.createElement('div');
      div.className = 'source';
      div.textContent = source.title || source.url || '';
      div.title = source.url || '';
      div.addEventListener('click', () => window.overlay.open(source.url));
      sources.appendChild(div);
    }
    offerText.textContent = msg.offer || '';
    offer.classList.toggle('hidden', !msg.offer);
    answerOn = true;
    render();
    clearTimeout(answerTimer);
    answerTimer = setTimeout(hideAnswer, ANSWER_MS);
  }

  function setMic(msg) {
    micButton.classList.toggle('on', msg.on === true);
    micButton.classList.toggle('off', msg.on === false);
    if (!msg.heard) return;
    clearTimeout(heardTimer);
    heard.classList.remove('fade');
    heard.textContent = msg.heard;
    heardTimer = setTimeout(() => {
      heard.classList.add('fade');
      heardTimer = setTimeout(() => { heard.textContent = ''; }, 800);
    }, HEARD_MS);
  }

  function followup(mode) {
    window.overlay.send({ type: 'followup', mode });
    hideAnswer();
  }

  box.addEventListener('mouseenter', () => window.overlay.interactive(true));
  box.addEventListener('mouseleave', () => window.overlay.interactive(false));
  document.getElementById('chevron').addEventListener('click', () => card.classList.toggle('collapsed'));
  document.getElementById('next').addEventListener('click', () => window.overlay.send({ type: 'next' }));
  document.getElementById('mic').addEventListener('click', () => window.overlay.send({ type: 'mic' }));
  document.getElementById('stop').addEventListener('click', () => window.overlay.send({ type: 'stop' }));
  document.getElementById('send').addEventListener('click', () => window.overlay.send({ type: 'hotkey' }));
  document.getElementById('cancel').addEventListener('click', () => window.overlay.send({ type: 'stop' }));
  document.getElementById('answer-close').addEventListener('click', hideAnswer);
  document.getElementById('show-me').addEventListener('click', () => followup('guide'));
  document.getElementById('do-it').addEventListener('click', () => followup('do'));
  modeButton.addEventListener('click', () => {
    setMode(mode === 'do' ? 'guide' : 'do');
    window.overlay.send({ type: 'mode', mode });
  });
  detailsButton.addEventListener('click', () => {
    const on = details.classList.toggle('hidden') === false;
    detailsButton.classList.toggle('on', on);
    place(panelPos.x, panelPos.y);
  });

  window.overlay.onMessage((msg) => {
    switch (msg.type) {
      case 'theme':
        document.documentElement.style.setProperty('--accent', msg.color);
        break;
      case 'follow':
        cursor.style.transition = msg.glide ? '' : 'none';
        cursor.style.transform = `translate(${msg.x}px, ${msg.y}px)`;
        cursor.classList.remove('hidden', 'tentative');
        break;
      case 'cursor':
        cursor.classList.remove('thinking', 'hop');
        void cursor.offsetWidth; // restart the hop
        cursor.classList.add('hop');
        clearTimeout(hopTimer);
        hopTimer = setTimeout(() => cursor.classList.remove('hop'), 950);  // after the glide (400 ms) + grow
        cursor.style.transition = '';
        cursor.style.transform = `translate(${msg.x}px, ${msg.y}px)`;
        place(msg.x, msg.y);
        label.textContent = msg.label || '';
        cursor.classList.toggle('tentative', Boolean(msg.tentative));
        cursor.classList.remove('hidden');
        break;
      case 'pulse':
        ring.classList.remove('on');
        void ring.offsetWidth; // restart the animation
        ring.classList.add('on');
        break;
      case 'mic':
        setMic(msg);
        break;
      case 'step':
        hideAnswer();
        if (msg.x !== undefined) place(msg.x, msg.y);
        text.textContent = msg.text || '';
        why.textContent = msg.why || '';
        state.textContent = STATES[msg.state] || '';
        cursor.classList.toggle('thinking', msg.state === 'thinking');
        panel.classList.toggle('paused', msg.state === 'paused');
        if (msg.mode) setMode(msg.mode);
        panelOn = true;
        render();
        clearTimeout(doneTimer);
        if (msg.state === 'done') doneTimer = setTimeout(hidePanel, 6000);
        break;
      case 'plan':
        renderPlan(msg.steps || []);
        break;
      case 'chat':
        chatLines = chatLines.concat({ who: msg.who || 'shadow', text: msg.text || '' }).slice(-CHAT_KEEP);
        renderChat();
        break;
      case 'hide':
        cursor.classList.add('hidden');
        panel.classList.add('hidden');
        window.overlay.interactive(false);
        requestAnimationFrame(() => requestAnimationFrame(() => window.overlay.hidden()));
        break;
      case 'show':
        cursor.classList.remove('hidden');
        if (panelOn || listeningOn || answerOn) panel.classList.remove('hidden');
        break;
      case 'clear':
        if (!msg.keepCursor) cursor.classList.add('hidden');
        cursor.classList.remove('tentative', 'thinking');
        label.textContent = '';
        clearTimeout(heardTimer);
        heard.textContent = '';
        micButton.classList.remove('on', 'off');
        chatLines = [];
        renderPlan([]);
        renderChat();
        hideAnswer();
        hidePanel();
        break;
      case 'answer':
        if (msg.x !== undefined) place(msg.x, msg.y);
        showAnswer(msg);
        break;
      case 'listening':
        listeningOn = Boolean(msg.on);
        if (listeningOn) {
          live.textContent = '';
          hideAnswer();
        }
        if (msg.x !== undefined) place(msg.x, msg.y);
        render();
        break;
      case 'transcript':
        live.textContent = msg.text || '';
        live.scrollTop = live.scrollHeight;
        break;
    }
  });
</script>
</body>
</html>
