<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    -webkit-user-select: none;
  }
  #cursor {
    position: absolute;
    left: 0;
    top: 0;
    transform: translate(-100px, -100px);
    transition: transform 400ms cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform;
  }
  #cursor.hidden { visibility: hidden; }
  #cursor svg {
    display: block;
    width: 24px;
    height: 24px;
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.35));
  }
  #label {
    position: absolute;
    left: 26px;
    top: 22px;
    padding: 5px 9px;
    border-radius: 8px;
    background: rgba(20, 20, 24, 0.9);
    color: #fff;
    font: 13px/1.3 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
  }
  #label:empty { display: none; }
  #listening {
    position: absolute;
    left: 0;
    top: 0;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 10px 5px 8px;
    border-radius: 999px;
    background: rgba(20, 20, 24, 0.9);
    color: #fff;
    font: 13px/1.3 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
  }
  #listening.hidden { display: none; }
  #listening .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ff3ea5;
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(0.8); opacity: 0.6; }
    50% { transform: scale(1.2); opacity: 1; }
  }
</style>
</head>
<body>
<div id="cursor" class="hidden">
  <svg viewBox="0 0 24 24">
    <path d="M3 2 L3 19 L7.5 15 L10.5 21.5 L13.5 20.2 L10.5 13.8 L16.5 13.8 Z"
          fill="#ff3ea5" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>
  </svg>
  <div id="label"></div>
</div>
<div id="listening" class="hidden"><span class="dot"></span>Listening…</div>
<script>
  const cursor = document.getElementById('cursor');
  const label = document.getElementById('label');
  const listening = document.getElementById('listening');

  window.overlay.onMessage((msg) => {
    switch (msg.type) {
      case 'cursor':
        cursor.style.transform = `translate(${msg.x}px, ${msg.y}px)`;
        label.textContent = msg.label || '';
        cursor.classList.remove('hidden');
        break;
      case 'hide':
        cursor.classList.add('hidden');
        requestAnimationFrame(() => requestAnimationFrame(() => window.overlay.hidden()));
        break;
      case 'show':
        cursor.classList.remove('hidden');
        break;
      case 'clear':
        cursor.classList.add('hidden');
        label.textContent = '';
        break;
      case 'listening':
        if (msg.on) {
          listening.style.left = `${msg.x + 18}px`;
          listening.style.top = `${msg.y + 18}px`;
        }
        listening.classList.toggle('hidden', !msg.on);
        break;
    }
  });
</script>
</body>
</html>
